# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$localip\
$kubernetes\
$directory\
${custom.worktree}\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$cmake\
$cobol\
$helm\
$kotlin\
$gradle\
$nim\
$nodejs\
$php\
$gcloud\
$openstack\
$direnv\
$env_var\
$crystal\
$custom\
$sudo\
$cmd_duration\
$jobs\
$time\
$status\
$container\
$shell\
$package\
$fill\
$python\
$golang\
$java\
$lua\
$aws\
$line_break\
$character"""

# Inserts a blank line between shell prompts
add_newline = true
fill.symbol = " "

[character]
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = "[➜](bold red)"

[custom.worktree]
# Empty output hides the module, so `when` is a plain boolean instead of a shell check (saves a spawn per prompt)
when = true
command = '''
out=$(git rev-parse --path-format=absolute --absolute-git-dir --git-common-dir 2>/dev/null) || exit
gd=${out%%
*}
common=${out#*
}
[ "$gd" != "$common" ] && basename "$common" .git
'''
format = "([\\($output\\) ]($style))"
style = "bold yellow"

[git_branch]
symbol = " "
format = "on [$symbol$branch(:$remote_branch)]($style) "

[python]
symbol = " "
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[java]
style = "red bold"
symbol = " "
format = "[$symbol($version )]($style)"

[directory]
truncation_symbol = "…/"

[aws]
symbol = " "
format = "[$symbol($profile )(\\($region\\) )(\\[$duration\\] )]($style)"

[package]
symbol = " "
format = "[$symbol$version]($style)"

[gradle]
symbol = " "
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[battery]
[[battery.display]]
threshold = 30
